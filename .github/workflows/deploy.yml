name: Build & Deploy Bookstore to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Step 1: Verify Spring Boot Build
  verify-backend:
    name: Build & Verify Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot with Maven
        run: |
          cd backend
          mvn clean test-compile

  # Step 2: Deploy to AWS EC2 via SSH & Docker Compose
  deploy:
    name: Deploy to AWS EC2
    needs: verify-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }} # usually 'ubuntu' or 'ec2-user'
          key: ${{ secrets.EC2_SSH_KEY }}       # your private key (.pem file content)
          port: 22
          script: |
            echo "==== Starting Automated Deployment on AWS EC2 ===="
            
            # 1. Navigate to or clone application directory
            APP_DIR="~/bookstore-app"
            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git $APP_DIR
              cd $APP_DIR
            else
              echo "Pulling latest changes..."
              cd $APP_DIR
              git reset --hard origin/main
              git pull origin main
            fi

            # 2. Configure Environment Variables
            echo "EC2_PUBLIC_IP=${{ secrets.EC2_HOST }}" > .env
            echo "DB_NAME=bookstore_db" >> .env
            echo "DB_USER=${{ secrets.DB_USER || 'bookstore_user' }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD || 'bookstore_pass' }}" >> .env
            echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD || 'rootsecurepassword123' }}" >> .env
            echo "NEXT_PUBLIC_API_URL=http://${{ secrets.EC2_HOST }}:8080/api" >> .env

            # 3. Docker Compose Build and Deploy
            echo "Rebuilding and starting Docker containers..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            # 4. Verify status
            sleep 15
            docker compose ps
            echo "==== Deployment Completed Successfully! ===="
