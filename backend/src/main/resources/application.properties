spring.application.name=bookstore-backend
server.port=8080

# Default profile: "dev" (embedded in-memory DB for instant local run without external setup)
# Production / Docker / EC2 sets SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Common JPA / Hibernate settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
