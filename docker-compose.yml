version: '3.8'

services:
  # MySQL Database Service (Persistent storage via Docker volume on EC2)
  mysql-db:
    image: mysql:8.0
    container_name: bookstore_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bookstore_db}
      MYSQL_USER: ${DB_USER:-bookstore_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bookstore_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecurepassword123}
    ports:
      - "3306:3306"
    volumes:
      - bookstore_mysql_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-bookstore_user}", "-p${DB_PASSWORD:-bookstore_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Boot REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookstore_backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bookstore_db}
      DB_USER: ${DB_USER:-bookstore_user}
      DB_PASSWORD: ${DB_PASSWORD:-bookstore_pass}
      HIBERNATE_DDL_AUTO: update
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    networks:
      - bookstore-net

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${EC2_PUBLIC_IP:-localhost}:8080/api
    container_name: bookstore_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://${EC2_PUBLIC_IP:-localhost}:8080/api
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - bookstore-net

volumes:
  bookstore_mysql_data:
    driver: local

networks:
  bookstore-net:
    driver: bridge
